<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | FigureAvatarAR</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">FigureAvatarAR</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "FigureAvatarAR",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
window.figureAvatarUnityInstance = unityInstance;
window.dispatchEvent(new Event('figure-avatar-unity-ready'));
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <style>
  #figure-avatar-pose-toggle { position:fixed; z-index:10001; top:max(12px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); border:0; border-radius:12px; padding:11px 15px; background:#172033ed; color:white; box-shadow:0 3px 14px #0005; font:600 15px system-ui,sans-serif; }
  #figure-avatar-pose-panel { position:fixed; z-index:10001; top:58px; left:max(12px,env(safe-area-inset-left)); width:min(330px,calc(100vw - 24px)); max-height:calc(100dvh - 92px); overflow:auto; box-sizing:border-box; padding:14px; border:1px solid #ffffff24; border-radius:16px; background:#101827f2; color:#fff; box-shadow:0 8px 28px #0007; font:14px/1.4 system-ui,sans-serif; }
  #figure-avatar-pose-panel[hidden] { display:none; }
  #figure-avatar-pose-panel h2 { margin:0 0 10px; font-size:16px; }
  #figure-avatar-pose-panel label { display:block; margin:10px 0 4px; color:#dbe4f0; }
  #figure-avatar-pose-panel select { width:100%; padding:9px; border:1px solid #667085; border-radius:8px; background:#202b3c; color:white; font:inherit; }
  .figure-avatar-axis { display:grid; grid-template-columns:32px 1fr 42px; gap:8px; align-items:center; margin:8px 0; }
  .figure-avatar-axis input { width:100%; accent-color:#79b8ff; }
  .figure-avatar-axis output { text-align:right; font-variant-numeric:tabular-nums; }
  #figure-avatar-scale-value { font-variant-numeric:tabular-nums; }
  .figure-avatar-actions { display:flex; gap:8px; margin-top:12px; }
  .figure-avatar-actions button { flex:1; padding:9px 6px; border:0; border-radius:8px; background:#34435a; color:white; font:inherit; }
  #figure-avatar-pose-panel input:disabled, #figure-avatar-pose-panel select:disabled, #figure-avatar-pose-panel button:disabled { opacity:.45; }
  #figure-avatar-ar-quicklook { z-index:10002; }
  #figure-avatar-ar-placement-hint { z-index:10001; }
</style>
<button id="figure-avatar-pose-toggle" type="button" aria-expanded="false">関節・サイズ ▼</button>
<section id="figure-avatar-pose-panel" hidden>
  <h2>関節を選んで姿勢を調整</h2>
  <fieldset id="figure-avatar-pose-fields" disabled style="border:0;padding:0;margin:0">
    <label for="figure-avatar-joint">操作する関節</label>
    <select id="figure-avatar-joint"></select>
    <div class="figure-avatar-axis"><span>X</span><input type="range" min="-90" max="90" value="0" step="1" data-axis="0"><output>0°</output></div>
    <div class="figure-avatar-axis"><span>Y</span><input type="range" min="-90" max="90" value="0" step="1" data-axis="1"><output>0°</output></div>
    <div class="figure-avatar-axis"><span>Z</span><input type="range" min="-90" max="90" value="0" step="1" data-axis="2"><output>0°</output></div>
    <div class="figure-avatar-actions"><button id="figure-avatar-reset-joint" type="button">この関節を戻す</button><button id="figure-avatar-reset-all" type="button">全身を初期化</button></div>
    <label for="figure-avatar-model-scale">モデルの大きさ <output id="figure-avatar-scale-value">1.00倍</output></label>
    <input id="figure-avatar-model-scale" type="range" min="0.5" max="2" value="1" step="0.05" style="width:100%;accent-color:#79b8ff">
  </fieldset>
</section>
<script>
(() => {
  const target = "hip";
  const unityReady = () => {
    const unity = window.figureAvatarUnityInstance;
    if (!unity) return;
    document.getElementById('figure-avatar-pose-fields').disabled = false;
  };
  window.addEventListener('figure-avatar-unity-ready', unityReady);
  unityReady();

  const groups = [
    ['胴体', [['hip','腰'],['supine','胴の付け根'],['chest','胸'],['neck','首'],['head','頭']]],
    ['腕', [['LeftShoulder','左肩'],['LeftUpperArm','左上腕'],['LeftElbow','左ひじ'],['LeftWrist','左手首'],['RightShoulder','右肩'],['RightUpperArm','右上腕'],['RightElbow','右ひじ'],['RightWrist','右手首']]],
    ['脚', [['LeftUpperLeg','左脚'],['LeftKnee','左ひざ'],['LeftAnkle','左足首'],['RightUpperLeg','右脚'],['RightKnee','右ひざ'],['RightAnkle','右足首']]]
  ];
  const select = document.getElementById('figure-avatar-joint');
  groups.forEach(([group, joints]) => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = group;
    joints.forEach(([name, label]) => {
      const option = document.createElement('option');
      option.value = name; option.textContent = label;
      optgroup.appendChild(option);
    });
    select.appendChild(optgroup);
  });

  const angles = new Map();
  const axes = Array.from(document.querySelectorAll('.figure-avatar-axis input'));
  const updateJoint = () => {
    const values = axes.map(input => Number(input.value));
    angles.set(select.value, values);
    const unity = window.figureAvatarUnityInstance;
    if (unity) unity.SendMessage(target, 'SetJointRotation', [select.value, ...values].join('|'));
    axes.forEach(input => input.nextElementSibling.textContent = input.value + '°');
  };
  const showJoint = () => {
    const values = angles.get(select.value) || [0,0,0];
    axes.forEach((input, index) => { input.value = values[index]; input.nextElementSibling.textContent = values[index] + '°'; });
  };
  axes.forEach(input => input.addEventListener('input', updateJoint));
  select.addEventListener('change', showJoint);

  document.getElementById('figure-avatar-pose-toggle').addEventListener('click', event => {
    const panel = document.getElementById('figure-avatar-pose-panel');
    panel.hidden = !panel.hidden;
    event.currentTarget.setAttribute('aria-expanded', String(!panel.hidden));
    event.currentTarget.textContent = panel.hidden ? '関節・サイズ ▼' : '操作を閉じる ▲';
  });
  document.getElementById('figure-avatar-reset-joint').addEventListener('click', () => {
    angles.set(select.value, [0,0,0]); showJoint(); updateJoint();
  });
  document.getElementById('figure-avatar-reset-all').addEventListener('click', () => {
    angles.clear(); showJoint();
    const scale = document.getElementById('figure-avatar-model-scale');
    scale.value = '1'; document.getElementById('figure-avatar-scale-value').textContent = '1.00倍';
    const unity = window.figureAvatarUnityInstance;
    if (unity) unity.SendMessage(target, 'ResetAllPose');
  });
  const scale = document.getElementById('figure-avatar-model-scale');
  scale.addEventListener('input', () => {
    document.getElementById('figure-avatar-scale-value').textContent = Number(scale.value).toFixed(2) + '倍';
    const unity = window.figureAvatarUnityInstance;
    if (unity) unity.SendMessage(target, 'SetModelScale', scale.value);
  });
})();
</script>

<style>
  #figure-avatar-ar-quicklook { position: fixed; z-index: 10000; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; padding: 9px 15px 9px 9px; border-radius: 999px; background: #fff; color: #172033; box-shadow: 0 3px 16px #0006; font: 600 15px system-ui, sans-serif; text-decoration: none; }
  #figure-avatar-ar-quicklook img { width: 42px; height: 42px; object-fit: cover; border-radius: 50%; }
  #figure-avatar-ar-placement-hint { position: fixed; z-index: 9999; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 66px); width: min(270px, 72vw); box-sizing: border-box; padding: 9px 12px; border-radius: 12px; background: #172033e8; color: #fff; box-shadow: 0 2px 12px #0005; font: 12px/1.5 system-ui, sans-serif; pointer-events: none; }
</style>
<a id="figure-avatar-ar-quicklook" rel="ar" href="./AR/FigureAvatarAR.usdz" aria-label="モデルをARで配置する">
  <img src="./AR/FigureAvatarAR-preview.png" alt=""><span>ARで配置</span>
</a>
<div id="figure-avatar-ar-placement-hint">AR画面で床面をタップして場所を指定。ドラッグで移動、2本指でサイズを調整できます。</div>
</body>
</html>
